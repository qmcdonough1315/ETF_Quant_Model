name: Weekly Quant Model & Supabase Sync

on:
  schedule:
    # Runs at 13:00 UTC (9:00 AM EDT) every Sunday
    # Minute: 0 | Hour: 13 | Day of Month: * | Month: * | Day of Week: 0 (Sunday)
    - cron: '0 13 * * 0'
  workflow_dispatch: # Allows manual triggers anytime from GitHub Actions tab

jobs:
  run-model:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn pykalman supabase alpaca-py getfactormodels

    - name: Execute Model and Sync to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      run: |
        python main.py
