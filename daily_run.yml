name: Daily Quant Model & Supabase Sync

on:
  schedule:
    # Runs at 20:30 UTC (4:30 PM EST) every weekday
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub web interface

jobs:
  run-model:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/python-version@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn pykalman supabase alpaca-py getfactormodels

    - name: Execute Model and Sync to Supabase
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      run: |
        python main.py
